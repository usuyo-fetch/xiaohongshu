[package]
name = "usuyo-fetch-xiaohongshu"
description = "usuyo 的小红书获取插件：按你存过的笔记链接取公开笔记页，做个人备份和离线阅读"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

# 独立仓库，不并进别的工作区。
[workspace]

[[bin]]
name = "usuyo-fetch-xiaohongshu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
url = "2.5.8"
usuyo-plugin-kit = { path = "../../usuyo/crates/usuyo-plugin-kit" }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
usuyo-plugin = { path = "../../usuyo/crates/usuyo-plugin" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

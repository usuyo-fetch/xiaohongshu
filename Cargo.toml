[package]
name = "usuyo-fetch-xiaohongshu"
description = "usuyo 的小红书获取插件：按你存过的笔记链接取公开笔记页，做个人备份和离线阅读"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

# 独立仓库，不并进别的工作区。
[workspace]

[[bin]]
name = "usuyo-fetch-xiaohongshu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.1"
url = "2.5.8"
usuyo-plugin = { path = "../../xiecun/crates/usuyo-plugin", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
usuyo-plugin = { path = "../../xiecun/crates/usuyo-plugin" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

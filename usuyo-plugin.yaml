# 小红书获取插件（设计见 usuyo 仓库 docs/platforms/xiaohongshu.md §2）。
# 只按你交来的笔记链接取公开笔记页，不登录、不签名；清单由 userscript/ 里的脚本在你的浏览器里交给 usuyo。
protocol: 1
id: usuyo-fetch/xiaohongshu
kind: fetch
name: 小红书
description: 按你存过的笔记链接取公开笔记页的正文、图片和视频，做个人备份
version: 0.1.0
license: MIT
maintainers: [fldicoahkiin]
upstream:
  - name: xhs-vault
    url: https://github.com/wkwunju/xhs-vault
    license: MIT
  - name: XHS-Downloader（你自己装、自己运行，插件只经本机 HTTP 调用）
    url: https://github.com/JoeanAmier/XHS-Downloader
    license: GPL-3.0
platforms: [xiaohongshu]
match:
  - "www.xiaohongshu.com/explore/*"
  - "www.xiaohongshu.com/search_result/*"
  - "www.xiaohongshu.com/discovery/item/*"
  - "www.xiaohongshu.com/user/profile/*"
  - "xhslink.com/*"
  - "xhslink.cn/*"
# 访客身份不是账号：usuyo 开一次首页、不登录，存下页面自己生成的 cookie，经 USUYO_VISITOR 交给笔记页请求。
visitors:
  - site: www.xiaohongshu.com
    name: 小红书
    url: https://www.xiaohongshu.com/
# 几种方法各列一项（usuyo 协议 §2.3.1），没做的也列；行和 usuyo 仓库 docs/platforms/routes.md 第 3 节一一对应。
methods:
  - id: note-page
    name: 公开笔记页
    access: public-web
    login: none
    account: visitor
    visitors: [www.xiaohongshu.com]
    risk:
      text: 空 cookie 的长链被送回首页；不填 cookie 批量取约 108 条后，复制链接的账号被下线
      source: {label: "XHS-Downloader #305", url: "https://github.com/JoeanAmier/XHS-Downloader/issues/305"}
    capabilities:
      fetch:
        outputs: [text, images, media:video, meta]
  - id: userscript
    name: 浏览器脚本（收藏、赞过）
    access: browser-session
    login: required
    account: own-browser
    delivers: links
    script: userscript/usuyo-xhs-saved.user.js
    risk:
      text: 网页对采集类扩展弹「有害插件」；只截获、不发请求的脚本没有处罚报告
      source: {label: "XHS-Downloader #283", url: "https://github.com/JoeanAmier/XHS-Downloader/issues/283"}
  - id: iphone
    name: iPhone 镜像
    built: false
    access: vision-ui
    login: required
    account: own-phone
    interaction: foreground
    drives: iphone
    capabilities:
      list:
        sources:
          - {source: "xiaohongshu:favorites", title: 收藏, action: favorite}
          - {source: "xiaohongshu:likes", title: 赞过, action: like}
  - id: android
    name: 安卓手机
    built: false
    access: vision-ui
    login: required
    account: own-phone
    interaction: foreground
    drives: android
    capabilities:
      list:
        sources:
          - {source: "xiaohongshu:favorites", title: 收藏, action: favorite}
          - {source: "xiaohongshu:likes", title: 赞过, action: like}
  # xhs-downloader：问你自己在本机运行的 XHS-Downloader（GPL-3.0，API 模式，默认 127.0.0.1:5556），
  # 插件不带它、不装它、不下载它；请求体固定 download:false、check_record:false，不带 cookie 和账号。
  # 接口形状读自它 2.8 版的源码和 README，只对假服务测过，见 README。
  - id: xhs-downloader
    name: XHS-Downloader
    access: public-web
    login: none
    account: none
    risk:
      text: 空 cookie 的长链被送回首页；不填 cookie 批量取约 108 条后，复制链接的账号被下线
      source: {label: "XHS-Downloader #305", url: "https://github.com/JoeanAmier/XHS-Downloader/issues/305"}
    capabilities:
      fetch:
        # 服务自己隔几秒才请求一次、还会重试，一篇要等一阵
        timeout: 10m
        outputs: [text, images, media:video, meta]
  - id: rsshub
    name: RSSHub（按创作者）
    built: false
    access: public-web
    login: none
    account: none
    risk:
      text: 无头浏览器在小红书上记高
      source: {label: "调研 06 §1.1", url: "https://github.com/usuyo/usuyo/blob/main/docs/research/06-platform-access-and-account-risk.md#11-七个层级"}
  - id: mediacrawler
    name: MediaCrawler 的结果文件
    access: private-api
    login: none
    account: none
    risk:
      text: 文件是你自己用登录了你账号的 MediaCrawler 跑出来的；这种方法只读你交来的文件，不向任何平台发请求。记录到的封禁在 MediaCrawler 采集的那一侧（它的 issue 里有小红书账号被永久封禁的报告）
      source: {label: "MediaCrawler #865", url: "https://github.com/NanmiCoder/MediaCrawler/issues/865"}
    capabilities:
      list:
        order: unordered
        files: ["*.json", "*.jsonl", "*.zip"]
        reads: MediaCrawler 保存成 json 或 jsonl 的小红书帖子文件（名字里带 contents；评论文件、CSV、SQLite 不读），或把 data 文件夹压成的 zip
settings:
  - {key: endpoint, label: XHS-Downloader 服务地址, type: string, default: "http://127.0.0.1:5556"}
  - {key: xhs-token, label: XHS-Downloader 访问令牌, type: string, secret: true}
pacing:
  xiaohongshu: {batch: true, interval: 15s, daily: 100}
permissions:
  fs:
    read: ["${INPUT}"]
    write: ["${OUT}"]
  network:
    mode: allowlist
    # ${setting.endpoint}：xhs-downloader 方法连的本机服务；ci.xiaohongshu.com：它默认的图片格式给的图片地址
    hosts: ["www.xiaohongshu.com", "xhslink.com", "xhslink.cn", "*.xhscdn.com", "ci.xiaohongshu.com", "${setting.endpoint}"]
  env: []
  devices: []
  gpu: false
run:
  command: ["${PLUGIN_DIR}/usuyo-fetch-xiaohongshu"]
